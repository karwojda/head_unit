# grvl (from Antmicro's calendar demo; malloc arena lives in SDRAM via the
# change-memory-region-used-by-malloc patch)
CONFIG_COMMON_LIBC_MALLOC=y
# 8 MB: grvl allocates its framebuffers here; three 32-bit 800x480 frames
# (4.6 MB) do not fit the demo's 3.7 MB, and grvl does not check for NULL.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8388608
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_FILE_SYSTEM=y
CONFIG_INPUT=y
CONFIG_INPUT_QUEUE_MAX_MSGS=128
CONFIG_DISPLAY=y

CONFIG_CPP_RTTI=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_LOG_MODE_DEFERRED=y
# Plain log lines: the Renode tests match whole lines.
CONFIG_LOG_BACKEND_SHOW_COLOR=n
