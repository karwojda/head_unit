CONFIG_POSIX_API=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_POSIX_FD_MGMT=y
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_SDCARD_IMAGE=y
CONFIG_FILE_SYSTEM_EXT2=y
CONFIG_DISK_ACCESS=y
CONFIG_MEMC=y
# 32-bit framebuffer: the spike's RGB565 build rendered with missing
# glyph fragments in Renode; the working prebuilt used 32-bit.
CONFIG_STM32_LTDC_ARGB8888=y
CONFIG_DISPLAY_LOG_LEVEL_WRN=y
CONFIG_DISPLAY_NT35510_INIT_PRIORITY=87
# Software rendering: Renode's DMA2D model garbles glyphs in RGB565 and
# throws on ARGB8888 transfers. Revisit on real hardware.
CONFIG_GRVL_USE_STM32_DMA2D=n

# BLE link to the wind sensor through an nRF52840 controller over HCI-UART.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
