CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="windmeter sim"

# Console contract with renode/tests/common.resource: plain lines.
CONFIG_SHELL=y
CONFIG_SHELL_VT100_COLORS=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
# Lines reach the console when they happen: the 1 s check measures from
# the "sent" line's timestamp.
CONFIG_LOG_MODE_IMMEDIATE=y

# A full round of four notifications at once (default 3 buffers each).
CONFIG_BT_ATT_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_CONN_TX_MAX=8
CONFIG_BT_BUF_ACL_TX_COUNT=8
